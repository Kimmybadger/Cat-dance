<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고양이와 댄스 파티</title>
<style>
  :root { --beat: 0.5s; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #12061f; overflow: hidden; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage {
    position: relative;
    width: min(100vw, 75vh); aspect-ratio: 3 / 4;
    overflow: hidden; border-radius: 14px;
    box-shadow: 0 0 60px rgba(180, 80, 255, .45);
  }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: pulse var(--beat) infinite; }
  .actor { position: absolute; will-change: transform; }
  .actor img { width: 100%; display: block; }
  .kid { animation: groove calc(var(--beat) * 2) ease-in-out infinite; transform-origin: 50% 100%; }
  .kid img { animation: hop var(--beat) ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 0 6px rgba(255,255,255,.25)); }
  .cat { animation: catSway calc(var(--beat) * 2) ease-in-out infinite; transform-origin: 45% 95%; z-index: 1; }
  .cat img { animation: catHop var(--beat) cubic-bezier(.3,0,.4,1) infinite; transform-origin: 45% 100%; filter: drop-shadow(0 0 8px rgba(120,255,120,.55)); }
  .cat.spin img { animation: catSpin calc(var(--beat) * 2) ease-in-out 1; }
  .kid { z-index: 2; }

  @keyframes pulse { 0%,100% { filter: brightness(.85) saturate(1.1); } 15% { filter: brightness(1.05) saturate(1.35); } }
  @keyframes groove {
    0%,100% { transform: rotate(-4deg) translateX(-1.5%); }
    50%     { transform: rotate(4deg)  translateX(1.5%); }
  }
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1, 1); }
    20%     { transform: translateY(0) scale(1.03, .96); }
    55%     { transform: translateY(-4%) scale(.98, 1.03); }
  }
  @keyframes catSway {
    0%,100% { transform: rotate(-12deg); }
    50%     { transform: rotate(12deg); }
  }
  @keyframes catHop {
    0%,100% { transform: translateY(0) scale(1.06, .92); }
    50%     { transform: translateY(-22%) scale(.95, 1.06); }
  }
  @keyframes catSpin {
    0%   { transform: translateY(0) rotateY(0); }
    50%  { transform: translateY(-35%) rotateY(180deg); }
    100% { transform: translateY(0) rotateY(360deg); }
  }

  /* 디스코 조명 */
  .lights { position: absolute; inset: -30%; z-index: 3; pointer-events: none; mix-blend-mode: screen; opacity: .45;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,0,200,.55) 0 8%, transparent 22%),
      radial-gradient(circle at 70% 40%, rgba(0,220,255,.55) 0 8%, transparent 22%),
      radial-gradient(circle at 50% 75%, rgba(255,240,0,.5) 0 8%, transparent 22%),
      radial-gradient(circle at 20% 70%, rgba(0,255,120,.45) 0 6%, transparent 20%);
    animation: spinLights 6s linear infinite; }
  @keyframes spinLights { to { transform: rotate(360deg); } }
  .flash { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.18), transparent 60%); animation: flash var(--beat) infinite; mix-blend-mode: screen; }
  @keyframes flash { 0% { opacity: 1; } 40%,100% { opacity: 0; } }

  .note { position: absolute; z-index: 4; pointer-events: none; font-size: clamp(18px, 5vw, 34px); color: #fff; text-shadow: 0 0 10px currentColor; animation: floatUp 3s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) rotate(0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-180px) rotate(25deg) scale(1.2); } }

  .ui { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; padding: 14px 12px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  button { border: 0; border-radius: 999px; padding: 10px 14px; font-size: 14px; white-space: nowrap; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff3cac, #784ba0 60%, #2b86c5); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  button:active { transform: scale(.95); }
  .title { position: absolute; top: 12px; left: 0; right: 0; z-index: 5; text-align: center; color: #fff; font-weight: 800; font-size: clamp(18px, 5vw, 28px); letter-spacing: 1px; text-shadow: 0 0 12px #ff3cac, 0 0 24px #784ba0; animation: titleBeat var(--beat) infinite; pointer-events: none; }
  @keyframes titleBeat { 0%,100% { transform: scale(1); } 20% { transform: scale(1.08); } }
</style>
</head>

  const setBeat = () => document.documentElement.style.setProperty('--beat', (60 / bpm) + 's');

  // 음표 띄우기
  const notes = ['♪','♫','♬','✨','⭐'];
  const colors = ['#ff6bd6','#6bf3ff','#fff36b','#7dff8a','#c79bff'];
  function spawnNote() {
    const n = document.createElement('span');
    n.className = 'note';
    n.textContent = notes[Math.random() * notes.length | 0];
    n.style.color = colors[Math.random() * colors.length | 0];
    n.style.left = (10 + Math.random() * 80) + '%';
    n.style.top = (45 + Math.random() * 35) + '%';
    stage.appendChild(n);
    setTimeout(() => n.remove(), 3000);
  }
  let noteTimer = setInterval(spawnNote, 60000 / bpm);

  // 고양이 회전
  function spin() {
    cat.classList.remove('spin'); void cat.offsetWidth; cat.classList.add('spin');
    setTimeout(() => cat.classList.remove('spin'), 120000 / bpm);
  }
  document.getElementById('spin').onclick = spin;
  cat.onclick = spin;

  // 속도
  document.getElementById('speed').onclick = (e) => {
    bpm = bpm === 120 ? 150 : 120;
    e.target.textContent = bpm === 120 ? '⚡ 빠르게' : '🐢 보통';
    setBeat();
    clearInterval(noteTimer); noteTimer = setInterval(spawnNote, 60000 / bpm);
  };

  // 간단한 신나는 비트 (Web Audio로 직접 생성)
  let ctx = null, playing = false, step = 0, nextTime = 0, timer = null;
  const bass = [45, 45, 52, 45, 48, 48, 55, 50];   // MIDI 음
  const lead = [69, 72, 76, 72, 74, 72, 69, 67, 69, 72, 76, 79, 76, 74, 72, 74];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function tone(t, f, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
    g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .25);
  }
  function noise(t, dur, vol, hp) {
    const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(g).connect(ctx.destination); s.start(t);
  }
  function schedule() {
    const s16 = 60 / bpm / 4;
    while (nextTime < ctx.currentTime + 0.12) {
      const t = nextTime, i = step % 16;
      if (i % 4 === 0) kick(t);
      if (i === 4 || i === 12) noise(t, .18, .35, 1200);
      if (i % 2 === 0) noise(t, .04, .12, 7000);
      if (i % 2 === 0) tone(t, hz(bass[(step / 2 | 0) % 8]), s16 * 1.8, 'sawtooth', .12);
      if (i % 2 === 0) tone(t, hz(lead[(step / 2 | 0) % 16]), s16 * 1.6, 'square', .05);
      nextTime += s16; step++;
    }
  }
  document.getElementById('music').onclick = (e) => {
    // 아이폰 무음 스위치가 켜져 있어도 소리가 나도록 미디어 재생 모드로 전환
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    if (!window._unlock) {
      const sr = 8000, n = sr, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
      const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
      a.loop = true; a.setAttribute('playsinline', ''); window._unlock = a;
    }
    window._unlock.play().catch(() => {});
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (playing) { clearInterval(timer); playing = false; e.target.textContent = '🔊 음악 켜기'; return; }
    ctx.resume(); step = 0; nextTime = ctx.currentTime + .05;
    timer = setInterval(schedule, 25); playing = true; e.target.textContent = '🔇 음악 끄기';
  };
})();
</script>
</body>
</html>
